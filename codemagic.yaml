
workflows:
  android-workflow:
    name: Universal Video Downloader - Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable

    scripts:
      - name: Generate Android and Web project files
        script: |
          flutter create --platforms=android,web .

      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  web-workflow:
    name: Universal Video Downloader - Website
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable

    scripts:
      - name: Generate Android and Web project files
        script: |
          flutter create --platforms=android,web .

      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Build Website
        script: |
          flutter build web --release

    artifacts:
      - build/web/**
